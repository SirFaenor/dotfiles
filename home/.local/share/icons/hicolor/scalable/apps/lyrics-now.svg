<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#1e2024"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e0245e"/>
    </linearGradient>
  </defs>
  <!-- fondo: finestra terminale -->
  <rect x="8" y="12" width="112" height="104" rx="18" fill="url(#bg)"/>
  <rect x="8" y="12" width="112" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <!-- righe di testo: passate, corrente (evidenziata), successive -->
  <rect x="24" y="34" width="52" height="7" rx="3.5" fill="#dcdfe4" opacity=".3"/>
  <rect x="24" y="52" width="66" height="9" rx="4.5" fill="#f5c84c"/>
  <rect x="24" y="72" width="44" height="7" rx="3.5" fill="#dcdfe4" opacity=".85"/>
  <rect x="24" y="88" width="34" height="7" rx="3.5" fill="#dcdfe4" opacity=".85"/>
  <!-- nota musicale -->
  <g fill="url(#note)">
    <rect x="98" y="58" width="6" height="40" rx="3"/>
    <path d="M101 58 c6 0 13 4 13 12 c-4-4-8-5-13-5z"/>
    <ellipse cx="94" cy="98" rx="10" ry="8" transform="rotate(-20 94 98)"/>
  </g>
</svg>
